<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tracebug</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Landing View -->
  <div id="landing" class="view">
    <div class="landing-card">
      <h1 class="landing-title">tracebug</h1>
      <p class="landing-subtitle">Inspect LangChain pipeline traces</p>
      <form id="landing-form" class="landing-form">
        <input
          type="text"
          id="share-id-input"
          class="landing-input"
          placeholder="Enter share ID"
          autocomplete="off"
          spellcheck="false"
        >
        <button type="submit" class="landing-btn">Load Session</button>
      </form>
      <div id="landing-error" class="landing-error"></div>
    </div>
  </div>

  <!-- Session View -->
  <div id="session" class="view hidden">
    <header class="session-header">
      <div class="session-header-left">
        <a href="/" class="session-back" title="New session">&larr;</a>
        <h1 class="session-title">tracebug</h1>
      </div>
      <div class="session-meta">
        <span class="session-meta-label">share_id</span>
        <span id="header-share-id" class="session-meta-value"></span>
        <span class="session-meta-label">session_id</span>
        <span id="header-session-id" class="session-meta-value"></span>
      </div>
    </header>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span>Loading session&hellip;</span>
    </div>

    <div id="session-error" class="session-error hidden"></div>

    <main id="timeline" class="timeline"></main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
